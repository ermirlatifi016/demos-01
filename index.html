<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web Page</title>
</head>
<body>

    <!-- Main Heading -->
    <h1>Welcome to My Website</h1>

    <!-- Subheading -->
    <h2>About This Page</h2>

    <!-- Text Paragraph with Bold Text -->
    <p>This is a paragraph of text. HTML is used to structure the layout of web pages, while <strong>CSS</strong> handles the styling.</p>

    <!-- Hyperlink to an external site -->
    <p>Visit the official source for web docs at <a href="https://developer.mozilla.org" target="_blank">MDN Web Docs</a>.</p>

    <!-- Image Element (Self-closing) -->
    <img src="https://placeholder.com" alt="Placeholder Image Example" width="150" height="150">

    <!-- Unordered Bulleted List -->
    <h3>My Favorite Fruits</h3>
    <ul>
        <li>Apples</li>
        <li>Bananas</li>
        <li>Oranges</li>
    </ul>

</body>
</html>
